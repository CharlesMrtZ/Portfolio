<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portifolio</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
        }

        canvas {
            display: block;
        }

        #gameContainer {
            width: 100%;
            display: flex;
            justify-content: center;    /* centraliza horizontal */
            align-items: flex-start;    /* cola no topo */
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div id="gameContainer"></div>
    <div id="painelProjeto" style="
    position: absolute;
    top: 10%;
    left: 10%;
    width: 80%;
    height: 80%;
    background: rgb(83, 83, 83);
    display: none;
    z-index: 1000;
    ">
        <iframe id="frameProjeto" style="width: 100%; height: 100%; border: none;">
        </iframe>
        <button onclick="fecharProjeto()" style="
    position: absolute;
    top: -20px;
    right: -20px;
    z-index: 1001;
">
            X
        </button>
    </div>


    <!-- DEBUG -->
    <div id="debugPanel" style="
    display: none;
    position: absolute;
    top: 10px;
    right: 10px;
    width: 200px;
    background-color: rgba(0, 0, 0, 0.8);
    color: rgb(0, 255, 0);
    font-family: monospace;
    padding: 10px;
    z-index: 2000;
    ">
        <div id="debugZoom">Zoom: </div>
        <div id="debugVelocity">Velocity: </div>
        <div>
            <button id="btnDebug" onclick="toggleDebugFisica()">
                Debug: OFF
            </button>
        </div>


        <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js"></script>
        <script type="module" src="./src/main.js"></script>
        <script src="./script.js"></script>
</body>

</html>
